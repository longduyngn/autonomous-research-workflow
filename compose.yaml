services:
  controller:
    build: .
    command: ["python", "main.py", "--no-env", "daemon"]
    volumes:
      - workflow-state:/app/storage
    init: true
    restart: unless-stopped
  dashboard:
    build: .
    command: ["python", "main.py", "--no-env", "dashboard", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - workflow-state:/app/storage
    init: true
volumes:
  workflow-state:
